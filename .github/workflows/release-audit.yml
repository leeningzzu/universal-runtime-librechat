name: Release audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/public_repo_guard.py
      - name: Block release while repository license is unresolved
        run: |
          test ! -f LICENSE_DECISION_REQUIRED.md || {
            echo "Repository license decision is still a publication blocker."
            exit 1
          }
