name: Release audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/public_repo_guard.py
      - name: Verify MIT original-source license and provenance notices
        run: |
          test -s LICENSE
          test -s NOTICE
          test -s src/universal_runtime/web_vendor/LICENSE.markdown-it-14.3.1.txt
          grep -Fq 'ACCEPTED_MIT_R001' docs/upstream/REPOSITORY_LICENSE_DECISION_R001.md
          grep -Fq 'e8f3be08623663d4ad7f7241e693c94469b63bb0' docs/upstream/librechat.lock.json
          test ! -e LICENSE_DECISION_REQUIRED.md
      - name: Test zero bundled-Packs source contract
        run: python scripts/check_packless_final_shell.py --self-test
